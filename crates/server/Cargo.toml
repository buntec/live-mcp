[package]
name = "live-mcp-server"
description = "live-mcp: MCP server and command-line tool for Ableton Live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "live-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
live-mcp-analysis = { version = "0.1.0", path = "../analysis" }
live-mcp-bridge = { version = "0.1.0", path = "../bridge" }
live-mcp-protocol = { version = "0.1.0", path = "../protocol" }
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[dev-dependencies]
live-mcp-bridge = { path = "../bridge", features = ["testkit"] }
rmcp = { version = "3.9", features = ["client", "transport-child-process"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process"] }
