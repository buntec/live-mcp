[package]
name = "live-mcp-ear"
description = "Audio-analysis plugin for live-mcp: listens at its place in Live's signal chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = "0.4.3"
live-mcp-analysis = { version = "0.1.0", path = "../analysis" }
live-mcp-protocol = { version = "0.1.0", path = "../protocol" }
nice-plug = { version = "0.4.2", default-features = false, features = ["vst3"] }
serde_json = "1.0.154"
