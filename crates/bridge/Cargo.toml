[package]
name = "live-mcp-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test support: run the Remote Script on a fake Live (needs python3).
testkit = ["dep:tempfile"]

[dependencies]
tempfile = { version = "3.27.0", optional = true }
getrandom = "0.4.3"
hex = "0.4.3"
live-mcp-protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
live-mcp-bridge = { path = ".", features = ["testkit"] }
futures = "0.3.34"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process"] }
